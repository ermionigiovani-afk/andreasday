<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrea's day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232F;--paper:#F7F5EF;--coral:#FF6B57;--sun:#FFC857;--teal:#1F8A8A;--line:rgba(22,35,47,.14)}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column}
h1,h2{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.05;letter-spacing:-.02em}
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden}.hero::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(10,15,25,.55),rgba(10,15,25,0))}.ttl{position:absolute;top:22px;left:0;right:0;text-align:center;z-index:1;color:#fff;font:800 44px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:0 0 28px 28px;background:var(--teal)}
.ph{width:100%;aspect-ratio:4/5;border-radius:0 0 28px 28px;background:var(--teal);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:15px;padding:24px;text-align:center}
.body{padding:24px 24px 16px;flex:1;display:flex;flex-direction:column;gap:14px}
h1{font-size:40px;font-weight:800}
h2{font-size:34px;font-weight:800}
p.msg{font-size:18px;line-height:1.55;max-width:34ch}
.foot{padding:12px 24px 28px;display:flex;flex-direction:column;gap:10px}
button,a.btn{font:500 17px 'DM Sans',sans-serif;border:0;border-radius:14px;min-height:54px;padding:0 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;gap:8px}
.primary{background:var(--coral);color:#fff}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;color:var(--ink);opacity:.7;min-height:40px;font-size:15px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{padding:22px 24px 0}
.bar{display:flex;gap:6px}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--coral)}
.count{font-size:14px;margin-top:10px;color:var(--teal);font-weight:500}
.num{width:64px;height:64px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;font:800 28px 'Bricolage Grotesque',sans-serif}
.what{font-size:15px;color:var(--teal);font-weight:500}
.hint{font-size:19px;line-height:1.5;max-width:36ch}
.addr{font-size:15px;opacity:.75}
.card{margin-top:auto;border-top:1.5px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease-out}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>

<main id="app"></main>

  title: "Χρόνια πολλά, μωρό μου 🎂",

  {tag:"🥐 Πρωινό", name:"Pan y Pepinillos Café", addr:"C. de El Escorial, 2", q:"Pan y Pepinillos Café, Calle de El Escorial, Madrid, Spain", hint:"Έτοιμος να αδράξεις την Andrea's day; ✨ Πάμε σε ένα από εκείνα τα καφέ που βλέπαμε από το σαλόνι μας να παίζουν μουσική τα πρωινά; ☕🥐"},
  {tag:"🛍️ Flea market", name:"El Rastro", addr:"Pl. de Cascorro", q:"El Rastro, Plaza de Cascorro, Madrid", hint:"Και τώρα, με τα καφεδάκια στο χέρι, πάμε να περιπλανηθούμε στο κυριακάτικο flea market 🛍️"},
  {tag:"🌮 Μεσημεριανό", name:"Tiki Taco", addr:"Plaza de Cascorro, 6", q:"Tiki Taco, Plaza de Cascorro 6, Madrid", hint:"Η γνωριμία μας ξεκίνησε με ένα ταξίδι στο Μεξικό που τελικά έχασα. Κάπως πρέπει να τιμήσουμε αυτή την ιστορία, οπότε tacos και margaritas it is! 🇲🇽🌮🍹"},
  {tag:"✨ Ευχές", name:"La Tienda de los Deseos", addr:"C. de la Escalinata, 7", q:"La Tienda de los Deseos, Calle de la Escalinata 7, Madrid", hint:"Κάθε φορά που βρίσκω ένα χαρτάκι σου κρυμμένο στα πράγματά μου, χαμογελάω 🥹 Σε πάω λοιπόν σε ένα μέρος γεμάτο χαρτάκια ✨ Κάνε την ευχή σου και, για να την ακούσει το σύμπαν, απλώς χτύπα το καμπανάκι 🔔"},

const app = document.getElementById('app');
let step = Math.max(0, Math.min(STOPS.length + 1, parseInt(location.hash.slice(1)) || 0));
function go(n){ step = n; location.hash = n; render(); window.scrollTo(0,0); }
function render(){
  let h = '';
  if(step === 0){
    h = `<div class="hero">` + (CONFIG.photo ? `<img class="photo" src="${CONFIG.photo}" alt="">` : `<div class="ph">Εδώ θα μπει η φωτογραφία</div>`) + `<div class="ttl">Andrea's Day</div></div>` +
      `<div class="body fade"><h1>${CONFIG.title}</h1><p class="msg">${CONFIG.intro}</p></div>
       <div class="foot"><button class="primary" onclick="go(1)">Ξεκίνα τη διαδρομή</button></div>`;
  } else if(step <= STOPS.length){
    const s = STOPS[step-1], last = step === STOPS.length;
    const bar = STOPS.map((_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    const dir = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.q)}&travelmode=walking`;
    h = `<div class="top"><div class="bar" aria-hidden="true">${bar}</div><div class="count">Στάση ${step} από ${STOPS.length}</div></div>
      <div class="body fade"><div class="num">${step}</div><div class="what">${s.tag}</div><h2>${s.name}</h2><p class="hint">${s.hint}</p>
      <div class="card"><div class="addr">${s.addr}, Madrid</div></div></div>
      <div class="foot"><a class="btn primary" href="${dir}" target="_blank" rel="noopener">Άνοιξε τις οδηγίες</a>
      <button class="ghost" onclick="go(${step+1})">${last ? 'Έφτασα, τέλος διαδρομής' : 'Έφτασα, επόμενη στάση'}</button>
      <button class="link" onclick="go(${step-1})">Πίσω</button></div>`;
  } else {
    h = `<div class="body fade" style="justify-content:center"><div class="num">&#10003;</div><h1>${CONFIG.outro}</h1></div>
      <div class="foot"><button class="ghost" onclick="go(0)">Ξανά από την αρχή</button></div>`;
  }
  app.innerHTML = h;
}
window.addEventListener('hashchange', ()=>{ const n = parseInt(location.hash.slice(1))||0; if(n!==step){ step=n; render(); } });
render();
</script>
